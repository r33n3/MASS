[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mass"
version = "0.1.0"
description = "Model & Application Security Suite - Comprehensive AI deployment security platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "r33n3", email = "mass@example.com" },
]
keywords = [
    "ai-security",
    "llm-security",
    "model-analysis",
    "compliance",
    "vulnerability-scanning",
    "prompt-injection",
    "jailbreak-detection",
    "mcp-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",  # SQLite async support
    "redis>=5.0",
    "httpx>=0.26.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "ruff>=0.2.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "httpx>=0.26.0",  # For TestClient
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinxcontrib-openapi>=0.8",
]
ml = [
    "torch>=2.0",
    "transformers>=4.36",
    "sentence-transformers>=2.3",
]
providers = [
    "openai>=1.12",
    "anthropic>=0.18",
    "boto3>=1.34",
    "google-genai>=1.0",
    "azure-identity>=1.15",
]
mcp-server = [
    "mcp>=1.0.0",
    "httpx>=0.26.0",
]
browser = [
    "playwright>=1.40",
]
all = [
    "mass[dev,docs,ml,providers,mcp-server,browser]",
]

[project.urls]
Homepage = "https://github.com/r33n3/MASS"
Documentation = "https://github.com/r33n3/MASS#readme"
Repository = "https://github.com/r33n3/MASS"
Issues = "https://github.com/r33n3/MASS/issues"
Changelog = "https://github.com/r33n3/MASS/blob/main/CHANGELOG.md"

[project.scripts]
mass = "mass.cli:app"
mass-mcp = "mass.mcp_server.server:main"

[project.entry-points."mass.probes"]
# Probe plugins will be registered here

[project.entry-points."mass.detectors"]
# Detector plugins will be registered here

[tool.hatch.build.targets.wheel]
packages = ["src/mass"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
]

[tool.ruff.lint.isort]
known-first-party = ["mass"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG", "S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "asyncpg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src/mass"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
