# Alembic configuration file for MASS

[alembic]
# Path to migration scripts
script_location = src/mass/storage/migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Prepend sys.path
prepend_sys_path = .

# Timezone for create_date
# timezone =

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# sourceless = false

# Version path separator
# version_path_separator = os

# Set to 'true' to search source files recursively in version_locations
# recursive_version_locations = false

# Output encoding
# output_encoding = utf-8

# Database URL (loaded from environment/settings in env.py)
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Run black and isort on generated files
# hooks = black, isort
# black.type = console_scripts
# black.entrypoint = black
# isort.type = console_scripts
# isort.entrypoint = isort

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
