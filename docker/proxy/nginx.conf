upstream mass_api {
    server api:8000;
}

upstream mass_ui {
    server ui:80;
}

server {
    listen 80;
    server_name _;

    # Proxy timeouts for long-running scan operations
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;

    # Request size limit (for large scan configs)
    client_max_body_size 10m;

    # API routes -> mass-api
    location /api/ {
        proxy_pass http://mass_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Disable buffering for faster response delivery
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket -> mass-api
    location /ws {
        proxy_pass http://mass_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"mass-proxy"}';
        add_header Content-Type application/json;
    }

    # Everything else -> mass-ui (dashboard)
    location / {
        proxy_pass http://mass_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
